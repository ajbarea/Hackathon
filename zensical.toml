[project]
site_name = "Myo Lever Controller"
site_description = "Drive a simulated Clearpath Jackal with one forearm: arm angle steers, a firm fist brakes. Best Presentation, AWARE-AI Fall Hackathon 2026."
site_author = "AJ Barea"
site_url = "https://ajbarea.github.io/Hackathon/"
repo_url = "https://github.com/ajbarea/Hackathon"
repo_name = "ajbarea/Hackathon"
copyright = "AJ Barea"

nav = [
  { "Home" = "index.md" },
  { "Drive it" = "drive.md" },
  { "How it works" = "how-it-works.md" },
  { "Results" = "results.md" },
  { "Data" = "data.md" },
  { "Deck" = "deck/" },
  { "Live sim" = "sim/" },
  { "Event kit" = [
      { "Design brief" = "BRIEF.md" },
      { "Runbook" = "RUNBOOK.md" },
      { "Spike findings" = "SPIKE_FINDINGS.md" },
  ]},
]

extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/reveal.js"]

[project.theme]
name = "material"
language = "en"
custom_dir = "overrides"

features = [
    "content.code.copy",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.progress",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[project.theme.icon]
logo = "material/robot-industrial"

[project.extra]
generator = false
og_image = "assets/sim-l2-slalom.png"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/ajbarea/Hackathon"
name = "Myo Lever Controller on GitHub"
